basePath: /api
definitions:
  api.Envelope:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
      total:
        type: integer
    type: object
  api.PageQuery:
    properties:
      page:
        type: integer
      page_size:
        type: integer
    type: object
  scheduler.OptionalTime:
    properties:
      time.Time:
        type: string
    type: object
  scheduler.createTaskRequest:
    properties:
      end_time:
        description: 截止时间（RFC3339），必填，须晚于当前时间；start_time 非空时须晚于开始时间
        type: string
      id:
        type: string
      name:
        type: string
      segment_seconds:
        type: integer
      start_time:
        allOf:
        - $ref: '#/definitions/scheduler.OptionalTime'
        description: 开始时间（RFC3339），为空（含空串）或已过则立即执行
      stream_url:
        type: string
    required:
    - stream_url
    type: object
  scheduler.createUserRequest:
    properties:
      password:
        type: string
      role:
        enum:
        - admin
        - user
        type: string
      username:
        type: string
    required:
    - password
    - role
    - username
    type: object
  scheduler.listTasksRequest:
    properties:
      keyword:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
    type: object
  scheduler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  scheduler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  scheduler.resetPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  scheduler.updateStatusRequest:
    properties:
      status:
        enum:
        - enabled
        - disabled
        type: string
    required:
    - status
    type: object
  scheduler.updateTaskRequest:
    properties:
      end_time:
        description: 截止时间（RFC3339），必填，须晚于当前时间；start_time 非空时须晚于开始时间
        type: string
      name:
        type: string
      segment_seconds:
        type: integer
      start_time:
        allOf:
        - $ref: '#/definitions/scheduler.OptionalTime'
        description: 开始时间（RFC3339），覆盖式：传 null 或空串清空改回立即执行
      stream_url:
        type: string
    type: object
  store.Task:
    properties:
      actual_end_time:
        type: string
      actual_start_time:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      end_time:
        type: string
      error_code:
        type: string
      error_msg:
        type: string
      id:
        type: string
      last_heartbeat_at:
        type: string
      max_retry:
        type: integer
      name:
        type: string
      output_path:
        type: string
      priority:
        type: integer
      retry_count:
        type: integer
      segment_seconds:
        type: integer
      start_time:
        type: string
      status:
        $ref: '#/definitions/store.TaskStatus'
      stream_url:
        type: string
      updated_at:
        type: string
      worker_id:
        type: string
    type: object
  store.TaskStatus:
    enum:
    - pending
    - queued
    - running
    - recovering
    - completed
    - record_failed
    - merge_failed
    - interrupted
    - cancelled
    - aborted
    type: string
    x-enum-varnames:
    - TaskPending
    - TaskQueued
    - TaskRunning
    - TaskRecovering
    - TaskCompleted
    - TaskRecordFailed
    - TaskMergeFailed
    - TaskInterrupted
    - TaskCancelled
    - TaskAborted
info:
  contact: {}
  description: 直播录制调度平台 API（调度器）
  title: RecMaestro API
  version: V0.1.0
paths:
  /audit-logs/list:
    post:
      consumes:
      - application/json
      description: POST 分页查询，统一信封 data 为日志数组、顶层 total；入参 JSON：page/page_size。行内含 username/resource_name
        名称快照
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.PageQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - 审计
  /login:
    post:
      consumes:
      - application/json
      description: 响应为统一信封，data 含 access_token / refresh_token / user
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Envelope'
      summary: 用户登录
      tags:
      - 认证
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 当前用户信息
      tags:
      - 认证
  /nodes:
    get:
      description: 响应为统一信封，data 为节点数组
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 节点列表
      tags:
      - 监控
  /refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Envelope'
      summary: 刷新 access token
      tags:
      - 认证
  /stats:
    get:
      description: 响应为统一信封，data 含 tasks_by_status / nodes_total / nodes_online / queue_size
        / scheduled_size
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 全局统计
      tags:
      - 监控
  /tasks:
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建任务
      tags:
      - 任务
  /tasks/{id}:
    delete:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除任务
      tags:
      - 任务
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Task'
      security:
      - BearerAuth: []
      summary: 任务详情
      tags:
      - 任务
    put:
      consumes:
      - application/json
      description: 时间字段为覆盖式更新：提交什么存什么，start_time 传 null 即清空改回立即执行；end_time 必填且须晚于当前时间与
        start_time；segment_seconds 非 0 须在 5-3600。
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 编辑参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.updateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 编辑任务
      tags:
      - 任务
  /tasks/{id}/abort:
    post:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 中止任务
      tags:
      - 任务
  /tasks/{id}/cancel:
    post:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 取消任务
      tags:
      - 任务
  /tasks/{id}/download:
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 下载录制产物
      tags:
      - 文件
  /tasks/{id}/ffmpeg-log/{name}:
    get:
      description: name 取 record（录制）/ merge（合并），文件由 worker 在录制/合并结束时留档
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '日志类型: record | merge'
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 下载 ffmpeg 原始日志
      tags:
      - 日志
  /tasks/{id}/files:
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 任务文件列表
      tags:
      - 文件
  /tasks/{id}/files/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除所选文件
      tags:
      - 文件
  /tasks/{id}/logs:
    get:
      description: 游标分页（before 为上一页最后一条 ID，倒序）；响应为统一信封，data 为日志数组
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 日志级别
        in: query
        name: level
        type: string
      - description: 阶段
        in: query
        name: stage
        type: string
      - description: 游标 ID
        in: query
        name: before
        type: integer
      - description: 每页条数
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 任务日志
      tags:
      - 日志
  /tasks/{id}/logs/download:
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 下载任务日志
      tags:
      - 日志
  /tasks/{id}/merge:
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 手动合并所选段
      tags:
      - 文件
  /tasks/{id}/progress:
    get:
      description: 响应为统一信封，data 含任务状态/绑定节点/段数/产物路径
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 任务进度
      tags:
      - 监控
  /tasks/{id}/retry:
    post:
      description: 仅失败/中断任务可重试；截止时间缺失或已过返回 409，请先编辑修改。成功后状态置 queued，retry_count 自增，响应含
        retry_count。
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重试任务
      tags:
      - 任务
  /tasks/list:
    post:
      consumes:
      - application/json
      description: POST 分页查询，统一信封 data 为任务数组、顶层 total；入参 JSON：page/page_size/status/keyword
      parameters:
      - description: 查询参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.listTasksRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 任务列表
      tags:
      - 任务
  /users:
    get:
      description: 响应为统一信封，data 为用户数组（不含密码哈希）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - 用户
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户
  /users/{id}:
    delete:
      description: 物理删除；护栏：内置管理员与当前登录账号不可删除。历史审计因名称快照仍可读出该用户
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户
  /users/{id}/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 重置用户密码
      tags:
      - 用户
  /users/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scheduler.updateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Envelope'
      security:
      - BearerAuth: []
      summary: 启用/禁用用户
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
